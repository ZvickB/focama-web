services:
  - type: web
    name: focama-backend
    env: node
    buildCommand: npm install
    startCommand: node backend/express-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OXYLABS_USERNAME
        sync: false
      - key: OXYLABS_PASSWORD
        sync: false
      - key: OPENAI_REFINEMENT_MODEL
        sync: false
      - key: OPENAI_FINALIZE_MODEL
        sync: false
      - key: OPENAI_FINALIZE_CONTEXT_MODEL
        sync: false
      - key: OPENAI_FINALIZE_EMPTY_MODEL
        sync: false
      - key: FINALIZE_ENRICHMENT_MODE
        sync: false
