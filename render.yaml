services:
  - type: web
    name: focama-backend
    env: node
    buildCommand: npm install
    startCommand: node backend/express-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        sync: false
      - key: SENSITIVE_IMAGE_SHADOW_ENABLED
        sync: false
      - key: SENSITIVE_IMAGE_REVEAL_ENABLED
        value: true
      - key: SIGHTENGINE_API_USER
        sync: false
      - key: SIGHTENGINE_API_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENAI_REFINEMENT_MODEL
        sync: false
      - key: OPENAI_FINALIZE_MODEL
        sync: false
      - key: OPENAI_FINALIZE_CONTEXT_MODEL
        sync: false
      - key: OPENAI_FINALIZE_EMPTY_MODEL
        sync: false
      - key: FINALIZE_ENRICHMENT_MODE
        sync: false
      - key: RAINFOREST_API_KEY
        sync: false
      - key: RATE_LIMIT_STORAGE
        value: memory
      - key: DISCOVERY_CACHE_READ_TIMEOUT_MS
        value: 750
      - key: DISCOVERY_SESSION_BACKGROUND_TIMEOUT_MS
        value: 5000
      - key: DISCOVERY_SESSION_READY_TIMEOUT_MS
        value: 2500
      - key: RAINFOREST_SEARCH_RATE_LIMIT
        value: 4
      - key: RAINFOREST_SEARCH_RATE_WINDOW_MS
        value: 10000
      - key: RAINFOREST_SEARCH_MAX_CONCURRENCY
        value: 4
      - key: RESEND_API_KEY
        sync: false
      - key: PRICE_WATCH_EMAILS_ENABLED
        sync: false
      - key: PRICE_WATCH_FROM_EMAIL
        sync: false
      - key: PRICE_WATCH_MANAGE_URL
        sync: false
      - key: PRICE_WATCH_INTERNAL_TOKEN
        sync: false
