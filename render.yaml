services:
  - type: web
    name: focama-backend
    env: node
    buildCommand: npm install
    startCommand: node backend/express-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENAI_REFINEMENT_MODEL
        sync: false
      - key: OPENAI_FINALIZE_MODEL
        sync: false
      - key: OPENAI_FINALIZE_CONTEXT_MODEL
        sync: false
      - key: OPENAI_FINALIZE_EMPTY_MODEL
        sync: false
      - key: FINALIZE_ENRICHMENT_MODE
        sync: false
      - key: KAILA_DEMO_PASSAGES_ENABLED
        sync: false
  - type: cron
    name: focama-price-watch
    env: node
    schedule: "0 13 * * *"
    buildCommand: npm install
    startCommand: node backend/jobs/check-price-watches.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RAINFOREST_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PRICE_WATCH_EMAILS_ENABLED
        sync: false
      - key: PRICE_WATCH_FROM_EMAIL
        sync: false
      - key: PRICE_WATCH_MANAGE_URL
        sync: false
