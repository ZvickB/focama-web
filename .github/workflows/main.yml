name: Price Watch

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  check-price-watches:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Price Watch
        run: |
          curl -fsS -X POST "${{ secrets.FOCAMAI_PRICE_WATCH_URL }}" \
            -H "Authorization: Bearer ${{ secrets.FOCAMAI_PRICE_WATCH_TOKEN }}"
